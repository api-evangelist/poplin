name: Poplin
kind: company
description: Poplin (formerly SudShare) is a nationwide on-demand laundry pickup and
  delivery marketplace connecting customers with independent, work-from-home "Laundry
  Pros" who wash, dry, and fold laundry, serving 500+ cities and 150,000+ customers.
  Poplin operates two consumer-facing mobile apps - the customer app and the Laundry
  Pro app - plus a Laundry Pro web portal (laundry-pro.poplin.co), but it does not
  expose a public or partner developer API. No developer portal or API reference was
  found at poplin.co, and the api.poplin.co subdomain resolves but returns a bare 404
  with no documentation, indicating internal-only use. Business/SMB accounts (property
  managers, hospitality) are onboarded through sales and an account manager rather
  than through self-service API keys.
